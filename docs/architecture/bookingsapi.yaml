  /v1/tenants/{tenantId}/patients/match:
    post:
      security:
      - OAuth2: []
      description: "Retrieves the ID of a patient that matches the provided search\
        \ criteria. If a search returns more than one matching patient, or a patient\
        \ cannot be found, an error will be returned."
      parameters:
      - $ref: "#/components/parameters/TenantIdParameter"
      x-apps-api:
        lambdaName: "@lambdas/post-patients-match"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                firstName:
                  type: "string"
                  minLength: 2
                  description: "First name of the Patient being search for."
                  example: "Bruce"
                lastName:
                  type: "string"
                  minLength: 2
                  description: "Last name of the Patient being searched for."
                  example: "Wayne"
                dateOfBirth:
                  type: "string"
                  description: "Date of birth of the Patient being searched for, in\
                    \ the format YYYY-MM-DD. The valid range for years is between\
                    \ 1900 and next year."
                  example: "2000-01-01"
              required:
              - "firstName"
              - "lastName"
              - "dateOfBirth"
      responses:
        "200":
          description: "Successfully retrieved a patient's ID."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                    format: "uuid"
                    description: "ID of the Patient found who matches the search criteria."
                    example: "ce64c193-ec3c-4872-b940-1fc5ccb8826b"
                required:
                - "id"
