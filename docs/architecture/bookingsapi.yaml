          - "string"
          - "null"
          description: "Value of the Contact"
          example: "0412345678"
      required:
      - "system"
      - "use"
      - "rank"
      - "value"
    ListUser:
      type: "object"
      properties:
        id:
          type: "string"
          description: "The UUID of the User."
          example: "128eb8c9-61c0-4b1b-9519-6bbb86bfe7aa"
        name:
          $ref: "#/components/schemas/UserName"
        contact:
          type: "array"
          items:
            $ref: "#/components/schemas/UserContact"
        active:
          type: "boolean"
        shownInAppointmentBook:
          type: "boolean"
      required:
      - "id"
      - "name"
      - "contact"
      - "active"
      - "shownInAppointmentBook"
      additionalProperties: false
    UserIdentifier:
      type: "object"
      properties:
        type:
          type: "string"
          enum:
          - "hpii"
          - "upin"
          description: "Type of practitioner identifier"
          example: "upin"
        system:
          type: "string"
          description: "References the standard system used for the identifier"
          example: "http://ns.electronichealth.net.au/id/medicare-provider-number"
        value:
          type:
          - "string"
          - "null"
          description: "Value of the Identifier"
          example: "7402575F"
        use:
          type:
          - "string"
          - "null"
          description: "Use of identifier"
          example: "official"
        location:
          type:
          - "object"
          - "null"
          properties:
            display:
              type:
              - "string"
              - "null"
              description: "Location the Identifier is relevant for"
              example: "Sacred Heart Hospital"
          required:
          - "display"
      required:
      - "type"
      - "system"
    User:
      type: "object"
      properties:
        id:
          type: "string"
          description: "The UUID of the User."
          example: "128eb8c9-61c0-4b1b-9519-6bbb86bfe7aa"
        address:
          type: "array"
          items:
            $ref: "#/components/schemas/Address"
        contact:
          type: "array"
          items:
            $ref: "#/components/schemas/UserContact"
        identifier:
          type: "array"
          items:
            $ref: "#/components/schemas/UserIdentifier"
        name:
          $ref: "#/components/schemas/UserName"
      required:
      - "id"
      - "address"
      - "contact"
      - "identifier"
      - "name"
    AvailabilitySchema:
      type: "object"
      properties:
        endAt:
          type: "string"
          format: "date-time"
          description: "End date and time of the availability (shown as ISO 8601 with\
            \ offset)"
          example: "2000-00-00T00:00:00.000+00:00"
        startAt:
          type: "string"
          format: "date-time"
          description: "Start date and time of the availability (shown as ISO 8601\
            \ with offset)"
          example: "2000-00-00T00:00:00.000+00:00"
      required:
      - "endAt"
      - "startAt"
      description: "Schedule availability provides the available blocks of time within\
        \ a given schedule"
    Schedule:
      type: "object"
      properties:
        appointmentTypeId:
          type:
          - "string"
          - "null"
          format: "uuid"
          description: "Appointment type ID"
          example: "fb5f0949-875e-4a35-9719-5727f3179651"
        practitionerId:
          type:
          - "string"
          - "null"
          format: "uuid"
          description: "Practitioner ID"
          example: "fb5f0949-875e-4a35-9719-5727f3179651"
        availabilities:
          type: "array"
          items:
            $ref: "#/components/schemas/AvailabilitySchema"
        endAt:
          type: "string"
          format: "date-time"
          description: "End date and time of the schedule (shown as ISO 8601 with\
            \ offset)"
          example: "2000-01-01T00:00:00.000+00:00"
        id:
          type:
          - "string"
          - "null"
          format: "uuid"
          description: "Unique identifier for the schedule (this can be null too)"
          example: "caceee93-8168-445f-942d-19f2c937852d"
        siteId:
          type:
          - "string"
          - "null"
          format: "uuid"
          description: "Site of service ID"
          example: "fb5f0949-875e-4a35-9719-5727f3179651"
        minutesDuration:
          type: "integer"
          minimum: 1
          maximum: 9999
          description: "Duration (in minutes) of the schedule"
          example: 10
        name:
          type:
          - "string"
          - "null"
          description: "Descriptive name of the schedule"
          example: "Walk-ins"
        startAt:
          type: "string"
          format: "date-time"
          description: "The start date and time of the schedule (shown as ISO 8601\
            \ with offset)"
          example: "2000-01-01T00:00:00.000+00:00"
      required:
      - "appointmentTypeId"
      - "practitionerId"
      - "availabilities"
      - "endAt"
      - "id"
      - "siteId"
      - "minutesDuration"
      - "name"
      - "startAt"
      description: "Schedules are created as a once off or recurring entity that allows\
        \ users to organise a single practitioner's time and categorise appointments\
        \ accordingly."
    Tenant:
      type: "object"
      properties:
        tenantId:
          type: "string"
          format: "uuid"
          description: "The UUID of the Tenant."
          example: "768e0295-33ce-45f3-ba5c-37587dcd4b30"
        tenantAccess:
          type: "string"
          enum:
          - "enabled"
          - "disabled"
          description: "Whether or not you are authorized to access the Tenant"
          example: "enabled"
      required:
      - "tenantId"
      - "tenantAccess"
    PractitionerFilters:
      type: "object"
      properties:
        contactType:
          type: "string"
          const: "practitioners"
          description: "Filter to practitioner contacts only."
        email:
          description: "Filter by the practitioner's email address."
          examples:
          - "jane.smith@clinic.com.au"
          type: "string"
          format: "email"
          pattern: "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\\
            -]*\\.)+[A-Za-z]{2,}$"
        firstName:
          description: "Filter by the practitioner's first name."
          examples:
          - "Jane"
          - "John"
          type: "string"
          minLength: 1
        lastName:
          description: "Filter by the practitioner's last name."
          examples:
          - "Smith"
          - "Jones"
          type: "string"
          minLength: 1
        mobilePhone:
          description: "Filter by the practitioner's mobile phone number."
          examples:
          - "0412345678"
          type: "string"
          minLength: 1
        providerNumber:
          description: "Filter by the practitioner's Medicare provider number."
          examples:
          - "2123456A"
          type: "string"
        specialtyCode:
          description: "Filter by the practitioner's Genie specialty code."
          examples:
          - "GP"
          - "CARDIO"
          type: "string"
          minLength: 1
        workPhone:
          description: "Filter by the practitioner's work phone number."
          examples:
          - "0298765432"
          type: "string"
          minLength: 1
      required:
      - "contactType"
      additionalProperties: false
      examples:
      - contactType: "practitioners"
        lastName: "Smith"
      - contactType: "practitioners"
        providerNumber: "2123456A"
      - contactType: "practitioners"
        firstName: "Jane"
        specialtyCode: "GP"
    AccountHolderFilters:
      type: "object"
      properties:
        contactType:
          type: "string"
          const: "account_holders"
          description: "Filter to account holder contacts only."
        birthDate:
          description: "Filter by the account holder's date of birth (ISO 8601, YYYY-MM-DD)."
          examples:
          - "1985-03-15"
          - "2000-12-01"
          type: "string"
          format: "date"
          pattern: "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\\
            d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\\
            d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$"
        email:
          description: "Filter by the account holder's email address."
          examples:
          - "patient@example.com"
          type: "string"
          format: "email"
          pattern: "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\\
            -]*\\.)+[A-Za-z]{2,}$"
        entityType:
          description: "Narrow results to a specific entity type (individual or business)."
          type: "string"
          enum:
          - "business"
          - "individual"
        firstName:
          description: "Filter by the account holder's first name."
          examples:
          - "Jane"
          - "John"
          type: "string"
          minLength: 1
        lastName:
          description: "Filter by the account holder's last name."
          examples:
          - "Smith"
          - "Jones"
          type: "string"
          minLength: 1
        medicareNumber:
          description: "Filter by the account holder's Medicare card number."
          examples:
          - "2123456701"
          type: "string"
        mobilePhone:
          description: "Filter by the account holder's mobile phone number."
          examples:
          - "0412345678"
          type: "string"
          minLength: 1
        workPhone:
          description: "Filter by the account holder's work phone number."
          examples:
          - "0298765432"
          type: "string"
          minLength: 1
      required:
      - "contactType"
      additionalProperties: false
      examples:
      - contactType: "account_holders"
        lastName: "Jones"
      - contactType: "account_holders"
        lastName: "Jones"
        birthDate: "1985-03-15"
      - contactType: "account_holders"
        medicareNumber: "2123456701"
    HospitalFilters:
      type: "object"
      properties:
        contactType:
          type: "string"
          const: "hospitals"
          description: "Filter to hospital contacts only."
        businessName:
          description: "Filter by the hospital's business name."
          examples:
          - "Royal North Shore Hospital"
          - "Westmead Hospital"
          type: "string"
          minLength: 1
        email:
          description: "Filter by the hospital's email address."
          examples:
          - "admin@rnsh.health.nsw.gov.au"
          type: "string"
          format: "email"
          pattern: "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\\
            -]*\\.)+[A-Za-z]{2,}$"
        workPhone:
          description: "Filter by the hospital's work phone number."
          examples:
          - "0299261111"
          type: "string"
          minLength: 1
      required:
      - "contactType"
      additionalProperties: false
      examples:
      - contactType: "hospitals"
        businessName: "Royal North Shore Hospital"
      - contactType: "hospitals"
        email: "admin@rnsh.health.nsw.gov.au"
    GenericContactFilters:
      type: "object"
      properties:
        contactType:
          type: "string"
          const: "generic_contacts"
          description: "Filter to generic contacts only."
        email:
          description: "Filter by the contact's email address."
          examples:
          - "contact@example.com"
          type: "string"
          format: "email"
          pattern: "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\\
            -]*\\.)+[A-Za-z]{2,}$"
        entityType:
          description: "Narrow results to a specific entity type (individual or business)."
          type: "string"
          enum:
          - "business"
          - "individual"
        firstName:
          description: "Filter by the contact's first name."
          examples:
          - "Alex"
          - "Jordan"
          type: "string"
          minLength: 1
        lastName:
          description: "Filter by the contact's last name."
          examples:
          - "Taylor"
          - "Morgan"
          type: "string"
          minLength: 1
        mobilePhone:
          description: "Filter by the contact's mobile phone number."
          examples:
          - "0412345678"
          type: "string"
          minLength: 1
        workPhone:
          description: "Filter by the contact's work phone number."
          examples:
          - "0298765432"
          type: "string"
          minLength: 1
      required:
      - "contactType"
      additionalProperties: false
      examples:
      - contactType: "generic_contacts"
        email: "contact@example.com"
      - contactType: "generic_contacts"
        firstName: "Alex"
        lastName: "Taylor"
  parameters:
    TenantIdParameter:
      schema:
        $ref: "#/components/schemas/TenantIdParameter"
      required: true
      in: "path"
      name: "tenantId"
      description: "The UUID of the Practice, also known as a Tenant."
      example: "3aef91c0-ff22-47e6-942d-182cb65cbf20"
      allowEmptyValue: false
    PatientIdParameter:
      schema:
        $ref: "#/components/schemas/PatientIdParameter"
      required: true
      in: "path"
      name: "patientId"
      description: "The UUID of a patient."
      example: "40027bce-841f-41de-9e06-a29864922558"
      allowEmptyValue: false
    PractitionerIdParameter:
      schema:
        $ref: "#/components/schemas/PractitionerIdParameter"
      required: true
      in: "path"
      name: "practitionerId"
      description: "The UUID of a practioner."
      example: "40027bce-841f-41de-9e06-a29864922558"
      allowEmptyValue: false
    AttachmentIdParameter:
      schema:
        $ref: "#/components/schemas/AttachmentIdParameter"
      required: true
      in: "path"
      name: "attachmentId"
      description: "The UUID of identfying an attachment."
      example: "3aef91c0-ff22-47e6-942d-182cb65cbf20"
      allowEmptyValue: false
    AppIdParameter:
      schema:
        $ref: "#/components/schemas/AppIdParameter"
      required: true
      in: "path"
      name: "appId"
      description: "The UUID of the app in Apigee"
      example: "40027bce-841f-41de-9e06-a29864922558"
      allowEmptyValue: false
    PairingCodeParameter:
      schema:
        $ref: "#/components/schemas/PairingCodeParameter"
      required: true
      in: "path"
      name: "pairingCode"
      description: "A string of 8 characters"
      example: "1234abcd"
      allowEmptyValue: false
    AppointmentIdParameter:
      schema:
        $ref: "#/components/schemas/AppointmentIdParameter"
      required: true
      in: "path"
      name: "appointmentId"
      description: "The UUID of an appointment."
      example: "40027bce-841f-41de-9e06-a29864922558"
      allowEmptyValue: false
    ProcedureIdParameter:
      schema:
        $ref: "#/components/schemas/ProcedureIdParameter"
      required: true
      in: "path"
      name: "procedureId"
      description: "The UUID of a procedure."
      example: "40027bce-841f-41de-9e06-a29864922558"
      allowEmptyValue: false
    ContactIdParameter:
      schema:
        $ref: "#/components/schemas/ContactIdParameter"
      required: true
      in: "path"
      name: "contactId"
      description: "The UUID of a contact."
      example: "40027bce-841f-41de-9e06-a29864922558"
      allowEmptyValue: false
paths:
  /v1/tenants/{tenantId}/patients/{patientId}/account-holders:
    get:
      security:
      - OAuth2: []
      description: "Retrieves account holders for a patient."
      parameters:
      - $ref: "#/components/parameters/TenantIdParameter"
      - $ref: "#/components/parameters/PatientIdParameter"
      x-apps-api:
        lambdaName: "@lambdas/get-account-holders"
      responses:
        "200":
          description: "Account holders successfully retrieved."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  accountHolders:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/RelatedPerson"
                required:
                - "accountHolders"
  /v1/tenants/{tenantId}:
    get:
      security:
      - OAuth2: []
      description: "Returns details of a tenant."
      parameters:
      - $ref: "#/components/parameters/TenantIdParameter"
      x-apps-api:
        lambdaName: "@lambdas/get-tenant-by-id"
      responses:
        "200":
          description: "Returns details of a tenant."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  tenantId:
                    type: "string"
                    format: "uuid"
                    description: "The UUID of the Tenant"
                    example: "d011246e-bc0b-4913-9742-5ad9dcb5ded2"
                  tenantNumber:
                    type:
                    - "string"
                    - "null"
                    description: "The Gentu Tenant Number"
                    example: "GTU0001"
                  timezone:
                    type:
                    - "string"
                    - "null"
                    description: "The IANA timezone of the Tenant/Practice"
                    example: "Australia/Melbourne"
                  tenantName:
                    type:
                    - "string"
                    - "null"
                    description: "Human readable name of the Tenant"
                    example: "Sacred Heart Hospital"
                required:
                - "tenantId"
                - "tenantNumber"
                - "timezone"
                - "tenantName"
  /v1/tenants/{tenantId}/patients/{patientId}/attachments/{attachmentId}:
    get:
      security:
      - OAuth2: []
      description: "Retrieves the metadata of an attachment."
      parameters:
      - $ref: "#/components/parameters/TenantIdParameter"
      - $ref: "#/components/parameters/PatientIdParameter"
      - $ref: "#/components/parameters/AttachmentIdParameter"
      x-apps-api:
        lambdaName: "@lambdas/get-read-attachment-metadata-by-id"
      responses:
        "200":
          description: "Attachment metadata successfully retrieved."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  status:
                    type: "string"
                    enum:
                    - "accepted"
                    - "scanned_infected"
                    - "scanned_clean"
                    - "failed"
                    - "completed"
                    description: "Status of the Attachment\n| Status | Meaning |\n\
                      |-----------------|-----------------|\n| accepted | The file\
                      \ has been accepted and is being processed before uploading\
                      \ |\n| scanned_infected | The file is infected and has been\
                      \ quarantined |\n| scanned_clean | The file is clean and has\
                      \ been queued for upload |\n| failed | The file failed to upload\
                      \ |\n| completed | The file uploaded successfully |"
                    example: "failed"
                  fileName:
                    type: "string"
                    description: "Name of the attachment."
                    example: "test.pdf"
                  setDate:
                    type: "string"
                    description: "The upload date to which the attachment is set during\
                      \ upload."
                    example: "2000-01-01T00:00:00.000+00:00"
                  createdAt:
                    type: "string"
                    description: "The date the attachment was created."
                    example: "2000-01-01T00:00:00.000+00:00"
                  id:
                    type: "string"
                    format: "uuid"
                    description: "The tracking ID of the uploaded attachment."
                    example: "d24bbd9e-7699-4103-b981-e55df0f2225f"
                required:
                - "status"
                - "fileName"
                - "setDate"
                - "createdAt"
                - "id"
                additionalProperties: false
  /v1/tenants/{tenantId}/appointments/{appointmentId}:
    patch:
      security:
      - OAuth2: []
      description: "This endpoint updates an appointment. Currently, it supports only\
        \ the following action\n| Action | Meaning |\n|-----------------|-----------------|\n\
        | cancel | Change status of appointment to `cancelled` |"
      parameters:
      - $ref: "#/components/parameters/TenantIdParameter"
      - $ref: "#/components/parameters/AppointmentIdParameter"
      x-apps-api:
        lambdaName: "@lambdas/patch-update-appointment"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppointment"
      responses:
        "200":
          description: "Appointment successfully updated."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                    format: "uuid"
                    description: "The UUID of the cancelled appointment."
                required:
                - "id"
                description: "Response body for the appointment cancellation."
                example:
                  id: "123e4567-e89b-12d3-a456-426614174000"
        "400":
          description: "One or more fields failed validation"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  details:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        validation:
                          type: "string"
                          description: "Data type on which the validation failed"
                          example: "uuid"
                        code:
                          type: "string"
                          description: "Error description"
                          example: "invalid_string"
                        message:
                          type: "string"
                          description: "Error message"
                          example: "Invalid uuid"
                        path:
                          type: "array"
                          items:
                            anyOf:
                            - type: "string"
                            - type: "number"
                          description: "Path to the field that failed validation"
                          example:
                          - "id"
                      required:
                      - "code"
                      - "message"
                      - "path"
                    description: "List of validation errors"
                    example:
                    - validation: "uuid"
                      code: "invalid_string"
                      message: "Invalid uuid"
                      path:
                      - "id"
                  message:
                    type: "string"
                    enum:
                    - "Validation error"
                    description: "Error message"
                    example: "Validation error"
                required:
                - "details"
                - "message"
        "404":
          description: "One of the provided IDs was not found"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    description: "Error message"
                    example: "Unable to find XYZ resource with id: {ID}"
                required:
                - "message"
        "409":
          description: "The appointment cannot be updated. It is in an invalid status"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    description: "Error message"
                    example: "Can only change the status of an appointment with status\
                      \ 'none', 'confirmed' or 'in waiting room'"
                required:
                - "message"
        "422":
          description: "The appointment cannot be updated"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    description: "Error message"
                    example: "Unable to cancel an appointment that is in the past"
                required:
                - "message"
    get:
      security:
      - OAuth2: []
      description: "Retrieves an appointment by its id."
      parameters:
      - $ref: "#/components/parameters/TenantIdParameter"
      - $ref: "#/components/parameters/AppointmentIdParameter"
      x-apps-api:
        lambdaName: "@lambdas/get-appointment-by-id"
      responses:
        "200":
          description: "Appointment successfully retrieved."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /v1/tenants/{tenantId}/contacts/{contactId}:
    patch:
      security:
      - OAuth2: []
      description: "Update an existing contact for a tenant. Only individual Account\
        \ Holder contacts are supported."
      parameters:
      - $ref: "#/components/parameters/TenantIdParameter"
      - $ref: "#/components/parameters/ContactIdParameter"
      x-apps-api:
        lambdaName: "@lambdas/patch-update-contact"
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: "object"
                properties:
                  address:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/ContactAddress"
                  birthDate:
                    type:
                    - "string"
                    - "null"
                  contact:
                    type: "array"
                    items:
                      allOf:
                      - $ref: "#/components/schemas/ContactPoint"
                      - type: "object"
                        properties:
                          use:
                            type: "string"
                            enum:
                            - "home"
                            - "work"
                            - "mobile"
                        additionalProperties: false
                  contactType:
                    type: "string"
                    enum:
