      description: "Retrieves a list of users."
      parameters:
      - $ref: "#/components/parameters/TenantIdParameter"
      x-apps-api:
        lambdaName: "@lambdas/get-users"
      responses:
        "200":
          description: "Users successfully retrieved."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ListUser"
  /v1/tenants/{tenantId}/contacts/list:
    post:
      operationId: "postV1Tenants:tenantIdContactsList"
      description: "Search and filter contacts from the address book. At least one\
        \ substantive filter (e.g. lastName, email) must be provided alongside the\
        \ required contactType."
      security:
      - OAuth2: []
      responses:
        "200":
          description: "Contacts list returned"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  contacts:
                    type: "array"
                    items: {}
                  pagination:
                    type: "object"
                    properties:
                      next:
                        anyOf:
                        - type: "string"
                        - type: "null"
                      total:
                        type: "integer"
                        minimum: 0
                        maximum: 9007199254740991
                    required:
                    - "next"
                    - "total"
                    additionalProperties: false
                required:
                - "contacts"
                - "pagination"
                additionalProperties: false
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                filters:
                  oneOf:
                  - $ref: "#/components/schemas/PractitionerFilters"
                  - $ref: "#/components/schemas/AccountHolderFilters"
                  - $ref: "#/components/schemas/HospitalFilters"
                  - $ref: "#/components/schemas/GenericContactFilters"
                  description: "Filters to apply. Must include contactType and at\
                    \ least one substantive filter field."
                pagination:
                  type: "object"
                  properties:
                    cursor:
                      description: "Opaque cursor returned from a previous response\
                        \ to fetch the next page."
                      examples:
                      - "eyJpZCI6IjEyMyJ9"
                      type: "string"
                    limit:
                      type: "integer"
                      minimum: 1
                      maximum: 100
                      description: "Number of contacts to return per page (1–100)."
                      examples:
                      - 20
                      - 50
                      - 100
                  required:
                  - "limit"
                  additionalProperties: false
              required:
              - "filters"
              - "pagination"
              additionalProperties: false
              examples:
              - filters:
                  contactType: "practitioners"
                  lastName: "Smith"
                pagination:
                  limit: 20
              - filters:
                  contactType: "practitioners"
                  providerNumber: "2123456A"
                pagination:
                  limit: 10
                  cursor: "eyJpZCI6IjEyMyJ9"
              - filters:
                  contactType: "account_holders"
                  lastName: "Jones"
                  birthDate: "1985-03-15"
                pagination:
                  limit: 20
              - filters:
                  contactType: "account_holders"
                  medicareNumber: "2123456701"
                pagination:
                  limit: 20
              - filters:
                  contactType: "hospitals"
                  businessName: "Royal North Shore Hospital"
                pagination:
                  limit: 50
              - filters:
                  contactType: "generic_contacts"
                  email: "contact@example.com"
                pagination:
                  limit: 20
      parameters:
      - schema:
          type: "string"
        in: "path"
        name: "tenantId"
        required: true
  /v1/tenants/{tenantId}/patients/{patientId}/account-holders/{holderId}:
    put:
      operationId: "putV1Tenants:tenantIdPatients:patientIdAccount-holders:holderId"
      description: "Link a patient or contact as an account holder for a patient,\
        \ or update their primary status. The holderId can be the UUID of either an\
        \ existing patient or an individual account holder contact."
      security:
      - OAuth2: []
      responses:
        "200":
          description: "Account holder updated"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                    format: "uuid"
                    pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                    description: "The ID of the linked account holder (patient or\
                      \ contact)"
                required:
                - "id"
        "201":
          description: "Account holder linked"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                    format: "uuid"
                    pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                    description: "The ID of the linked account holder (patient or\
                      \ contact)"
                required:
                - "id"
      parameters:
      - in: "path"
        name: "patientId"
        schema:
          type: "string"
          format: "uuid"
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
        required: true
      - in: "path"
        name: "holderId"
        schema:
          type: "string"
          format: "uuid"
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
        required: true
      - schema:
          type: "string"
        in: "path"
        name: "tenantId"
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                primary:
                  description: "Whether this account holder is the primary account\
                    \ holder for the patient. If omitted, the existing primary status\
                    \ is preserved on update and defaults to false on create."
                  type: "boolean"
              additionalProperties: false
webhooks: {}
