  /v1/tenants/{tenantId}/schedules:
    get:
      security:
      - OAuth2: []
      description: "Returns a list of Schedules for the practice."
      parameters:
      - $ref: "#/components/parameters/TenantIdParameter"
      - schema:
          type: "string"
          description: "Comma delimited list of which appointment types to filter\
            \ by"
          example: "0adac388-a637-474d-8a77-eaaa01158c1e, 1adac388-a637-474d-8a77-eaaa01158c1f"
        required: false
        name: "appointmentTypeIds"
        in: "query"
      - schema:
          type: "string"
          description: "Comma delimited list of which practitioners to filter by"
          example: "0adac388-a637-474d-8a77-eaaa01158c1e, 1adac388-a637-474d-8a77-eaaa01158c1f"
        required: false
        name: "practitionerIds"
        in: "query"
      - schema:
          type: "string"
          format: "date-time"
          description: "Show Schedules that begin after the provided date time (ISO\
            \ 8601 with offset).\n\n **Important**: This field must be URI Encoded\
            \ as it includes symbols that will otherwise be stripped from the URL."
          example: "2000-01-01T00:00:00.000+10:00"
        required: true
        name: "fromDate"
        in: "query"
      - schema:
          type: "string"
          format: "date-time"
          description: "Show Schedules that begin between fromDate up until the provided\
            \ date time (ISO 8601 with offset).\n\n This date time cannot be greater\
            \ than 90 days after the _fromDate_.\n\n **Important**: This field must\
            \ be URI Encoded as it includes symbols that will otherwise be stripped\
            \ from the URL."
          example: "2000-04-01T00:00:00.000+10:00"
        required: true
        name: "toDate"
        in: "query"
      x-apps-api:
        lambdaName: "@lambdas/get-schedules"
      responses:
        "200":
          description: "Schedules successfully retrieved."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  schedules:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Schedule"
                required:
                - "schedules"
