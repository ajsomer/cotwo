                type: "number"
                exclusiveMinimum: 0
                description: "Rank indicates what order the Contact should be used\
                  \ in, the lowest number is the highest priority. Must be a positive\
                  \ number."
                example: 1
              value:
                type:
                - "string"
                - "null"
                description: "Value of the Contact"
                example: "0412345678"
            required:
            - "system"
            - "use"
            - "rank"
            - "value"
      required:
