                    - "individual"
                  holderType:
                    type: "string"
                    enum:
                    - "contact"
                    - "patient"
                  identifier:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/ContactIdentifier"
                  name:
                    $ref: "#/components/schemas/ContactHumanName"
                  primary:
                    type: "boolean"
                required:
                - "contactType"
                - "entityType"
                additionalProperties: false
      responses:
        "200":
          description: "The contact was successfully updated"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                    format: "uuid"
                    description: "The UUID of the updated contact."
                required:
                - "id"
  /v1/tenants/{tenantId}/patients/{patientId}:
    patch:
      security:
      - OAuth2: []
      description: "Update a patient\n- Additional content, such as emergency contacts\
        \ and name components, is defined under the extension array. This aligns with\
        \ the FHIR standard's concept of 'additional content defined by implementations.'\n\
        - Emergency contact and associated fields, such as relationship, are added\
        \ as a nested array under extensions.\n- Name components can be individually\
        \ set via extension entries: 'firstname', 'middlename', 'maiden-name', and\
        \ 'pronouns'. These may be used instead of name.given for first/middle names\
        \ — the two modes are mutually exclusive per request.\n- To clear a name field,\
        \ pass null as the valueString for 'firstname', 'middlename', 'maiden-name',\
        \ or 'pronouns' extension entries.\n- We recommend fetching the patient resource\
        \ first to get the current state of the patient before updating."
      parameters:
      - $ref: "#/components/parameters/TenantIdParameter"
      - $ref: "#/components/parameters/PatientIdParameter"
      x-apps-api:
        lambdaName: "@lambdas/patch-update-patient"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                address:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      city:
                        type:
                        - "string"
                        - "null"
                        description: "City or Suburb of the Address"
                        example: "Brisbane | West End"
                      line:
                        type: "array"
                        items:
                          type: "string"
                          description: "Street details of the Address. The first entry\
                            \ is line 1 of the address. All remaining entries will\
                            \ be joined into line 2"
                          example: "100 Test St"
                        maxItems: 2
                      postalCode:
                        type:
                        - "string"
                        - "null"
                        description: "Postcode of the Address"
                        example: "4000"
                      state:
                        type:
                        - "string"
                        - "null"
                        enum:
                        - "ACT"
                        - "NSW"
                        - "NT"
                        - "QLD"
                        - "SA"
                        - "TAS"
                        - "VIC"
                        - "WA"
                        description: "State of the Address"
                        example: "QLD"
                      use:
                        type: "string"
                        enum:
                        - "home"
                        description: "Name identifier (label) of this Address. Only\
                          \ accept home for now"
                        example: "home"
                      type:
                        type: "string"
                        enum:
                        - "postal"
                        - "physical"
                        description: "Type of the Address. postal | physical"
                        example: "postal"
                    required:
                    - "use"
                    - "type"
                  minItems: 1
                  description: "List of patient addresses."
                gender:
                  type:
                  - "string"
                  - "null"
                  enum:
                  - "female"
                  - "male"
                  - "unspecified"
                  description: "Gender of the Patient"
                  example: "male"
                name:
                  type: "object"
                  properties:
                    given:
                      type:
                      - "string"
                      - "null"
                      minLength: 2
                      description: "NOTE: prefer using 'firstname' and 'middlename'\
                        \ within 'extension' for more predictable control over name\
                        \ fields. Given name/s, will be split in first and middle\
                        \ names if present e.g. first name: `Joey` & middle name:\
                        \ `Doe Boe`"
                      example: "Joey Doe Boe"
                    family:
                      type: "string"
                      minLength: 2
                      description: "Family name of the patient"
                      example: "Smith"
                    prefix:
                      type:
                      - "string"
                      - "null"
                      description: "Prefix for name"
                      example: "Mr"
                contact:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      system:
                        type: "string"
                        enum:
                        - "email"
                        - "phone"
                        description: "Type of the Contact"
                        example: "phone"
                      use:
                        type: "string"
                        enum:
                        - "home"
                        - "work"
                        - "mobile"
                        description: "Purpose of this contact"
                        example: "home"
                      rank:
                        type: "number"
                        exclusiveMinimum: 0
                        description: "Rank indicates what order the Contact should\
                          \ be used in, the lowest number is the highest priority.\
                          \ Must be a positive number."
                        example: 1
                      value:
                        type:
                        - "string"
                        - "null"
                        description: "Value of the Contact"
                        example: "0412345678"
                    required:
                    - "system"
                    - "use"
                    - "rank"
                    - "value"
                  minItems: 1
                  description: "List of patient contact details. Must be a combination\
                    \ of email/home, phone/mobile, phone/work and phone/home"
                identifier:
                  type: "array"
                  items:
                    $ref: "#/components/schemas/Patient Identifier"
                  description: "List of Patient Identifier(s), maximum of one per\
                    \ identifier type may be specified, i.e. you can not specify two\
                    \ Medicare Cards."
                deceased:
                  type: "object"
                  properties:
                    deceasedBoolean:
                      type: "boolean"
                      description: "Indicates if the Patient is deceased."
                      example: true
                    deceasedDateTime:
                      type:
                      - "string"
                      - "null"
                      description: "Date of death of the Patient."
                      example: "2000-01-01"
                  required:
                  - "deceasedBoolean"
                emailEnabled:
                  type: "boolean"
                  description: "Whether the patient has opted in to email contact."
                  example: true
                occupation:
                  type:
                  - "string"
                  - "null"
                  description: "Occupation of the Patient"
                  example: "Doctor"
                smsEnabled:
                  type: "boolean"
                  description: "Whether the patient has opted in to SMS contact."
                  example: true
                indigenousStatus:
                  type:
                  - "string"
                  - "null"
                  enum:
                  - "aboriginal"
                  - "torres_strait_islander"
                  - "both"
                  - "neither"
                  - "declined"
                  description: "Indigenous Status of the Patient"
                  example: "aboriginal"
                extension:
                  type: "array"
                  items:
                    oneOf:
                    - type: "object"
                      properties:
                        system:
                          type: "string"
                          enum:
                          - "emergency-contacts"
                        valueArray:
                          type: "array"
                          items:
                            anyOf:
                            - $ref: "#/components/schemas/Emergency Contact"
                            - allOf:
                              - $ref: "#/components/schemas/Emergency Contact"
                              - properties:
                                  id:
                                    type: "string"
                                    format: "uuid"
                                  relationship:
                                    type: "array"
                                    items:
                                      type: "object"
                                      properties:
                                        coding:
                                          type: "array"
                                          items:
                                            type: "object"
                                            properties:
                                              code:
                                                type: "string"
                                                enum:
                                                - "C"
                                                - "N"
                                                description: "Symbol in syntax defined\
                                                  \ by the system"
                                                example: "C"
                                              display:
                                                type: "string"
                                                description: "Representation defined\
                                                  \ by the system"
                                                example: "Emergency Contact"
                                            required:
                                            - "code"
                                        text:
                                          type: "string"
                                          description: "Text representation of the\
                                            \ relationship to the patient"
                                          example: "grandparent"
                                      required:
                                      - "coding"
                                    description: "The kind of relationship to patient\n\
                                      | Coding | Text | Definition |\n| -------- |\
                                      \ ----------- | --------------- |\n| [{'code':\
                                      \ 'C'}] | 'grandparent' | Emergency Contact\
                                      \ who is a grandparent |\n| [{'code':'C'}, {'code':\
                                      \ 'N'}] | 'daughter' | Emergency Contact who\
                                      \ is Next of Kin and a daughter |\n\nThe following\
                                      \ values are suggested:\nAunt, Brother, Child,\
                                      \ Cousin, Daughter, Dependent, Father, Grandchild,\
                                      \ Grandfather, Grandmother, Grandparent, Guardian,\
                                      \ Husband, Mother, Nephew, Niece, Parent, Partner,\
                                      \ Sibling, Sister, Son, Spouse, Uncle, Wife."
                                    example:
                                    - coding:
                                      - code: "C"
                                      - code: "N"
                                      text: "daughter"
                                  name:
                                    type: "object"
                                    properties:
                                      given:
                                        type: "string"
                                        minLength: 2
                                        description: "Given name/s, they will be split\
                                          \ in first and middle names if present e.g.\
                                          \ first name: `Joey` & middle name: `Doe\
                                          \ Boe`"
                                        example: "Joey Doe Boe"
                                      family:
                                        type:
                                        - "string"
                                        - "null"
                                        minLength: 2
                                        description: "Family name of the contact"
                                        example: "Smith"
                                  telecom:
                                    type: "array"
                                    items:
                                      type: "object"
                                      properties:
                                        system:
                                          type: "string"
                                          enum:
                                          - "phone"
                                        use:
                                          type: "string"
                                          enum:
                                          - "mobile"
                                        rank:
                                          type: "number"
                                          exclusiveMinimum: 0
                                          description: "Rank indicates what order\
                                            \ the Contact should be used in, the lowest\
                                            \ number is the highest priority. Must\
                                            \ be a positive number."
                                          example: 1
                                        value:
                                          type:
                                          - "string"
                                          - "null"
                                          description: "Value of the Contact"
                                          example: "0412345678"
                                      required:
                                      - "system"
                                      - "use"
                                      - "rank"
                                      - "value"
                                required:
                                - "id"
                                - "name"
                          description: "A contact party (e.g. guardian, partner, friend)\
                            \ for the patient. Use ID as key for this array."
                      required:
                      - "system"
                      - "valueArray"
                    - type: "object"
                      properties:
                        system:
                          type: "string"
                          enum:
                          - "firstname"
                        valueString:
                          type:
                          - "string"
                          - "null"
                          minLength: 1
                          description: "Patient's first name. Pass null to clear."
                          example: "Joey"
                      required:
                      - "system"
                      - "valueString"
                    - type: "object"
                      properties:
                        system:
                          type: "string"
                          enum:
                          - "maiden-name"
                        valueString:
                          type:
                          - "string"
                          - "null"
                          minLength: 1
                          description: "Patient's maiden name. Pass null to clear."
                          example: "Johnson"
                      required:
                      - "system"
                      - "valueString"
                    - type: "object"
                      properties:
                        system:
                          type: "string"
                          enum:
                          - "middlename"
                        valueString:
                          type:
                          - "string"
                          - "null"
                          minLength: 1
                          description: "Patient's middle name. Pass null to clear."
                          example: "Michael"
                      required:
                      - "system"
                      - "valueString"
                    - type: "object"
                      properties:
                        system:
                          type: "string"
                          enum:
                          - "pronouns"
                        valueString:
                          type:
                          - "string"
                          - "null"
                          enum:
                          - "any"
                          - "he/him"
                          - "he/they"
                          - "she/her"
                          - "she/they"
                          - "they/them"
                          description: "Patient's pronouns. Pass null to clear."
                          example: "he/him"
                      required:
                      - "system"
                      - "valueString"
                  description: "Additional patient fields. Use 'firstname' (required\
                    \ when using extension-based naming) and optionally 'middlename'\
                    \ to set individual name fields — mutually exclusive with name.given.\
                    \ Pass null for any of 'firstname', 'middlename', 'maiden-name',\
                    \ or 'pronouns' valueString to clear those fields. Use 'emergency-contacts'\
                    \ to update emergency contacts."
      responses:
        "200":
          description: "Patient successfully updated."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                    format: "uuid"
                    description: "ID of the updated patient"
                    example: "d24bbd9e-7699-4103-b981-e55df0f2225f"
                required:
                - "id"
        "400":
          description: "One or more fields failed validation"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  details:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        validation:
                          type: "string"
                          description: "Data type on which the validation failed"
                          example: "uuid"
                        code:
                          type: "string"
                          description: "Error description"
                          example: "invalid_string"
                        message:
                          type: "string"
                          description: "Error message"
                          example: "Invalid uuid"
                        path:
                          type: "array"
                          items:
                            anyOf:
                            - type: "string"
                            - type: "number"
                          description: "Path to the field that failed validation"
                          example:
                          - "id"
                      required:
                      - "code"
                      - "message"
                      - "path"
                    description: "List of validation errors"
                    example:
                    - validation: "uuid"
                      code: "invalid_string"
                      message: "Invalid uuid"
                      path:
                      - "id"
                  message:
                    type: "string"
                    enum:
                    - "Validation error"
                    description: "Error message"
                    example: "Validation error"
                required:
                - "details"
                - "message"
        "404":
          description: "One of the provided IDs was not found"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  message:
                    type: "string"
                    description: "Error message"
                    example: "Unable to find XYZ resource with id: {ID}"
                required:
                - "message"
