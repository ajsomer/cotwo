---
openapi: "3.0.0"
info:
  version: "1.0.0"
  title: "Bookings API"
  description: "Bookings API"
components:
  securitySchemes:
    OAuth2:
      type: "oauth2"
      description: "This API uses OAuth 2.0 with the client credentials grant flow."
      flows:
        clientCredentials:
          scopes: []
          tokenUrl: "https://api.pm.sandbox.magentus.com/oauth2/token"
  schemas:
    TenantIdParameter:
      type: "string"
      format: "uuid"
    PatientIdParameter:
      type: "string"
      format: "uuid"
    PractitionerIdParameter:
      type: "string"
      format: "uuid"
    AttachmentIdParameter:
      type: "string"
      format: "uuid"
    AppIdParameter:
      type: "string"
      format: "uuid"
    PairingCodeParameter:
      type: "string"
      format: "uuid"
    AppointmentIdParameter:
      type: "string"
      format: "uuid"
    ProcedureIdParameter:
      type: "string"
      format: "uuid"
    ContactIdParameter:
      type: "string"
      format: "uuid"
    RelatedPersonName:
      type: "object"
      properties:
        family:
          type:
          - "string"
          - "null"
          description: "Family name (often called 'Surname')"
          example: "Tribbiani"
        given:
          type:
          - "string"
          - "null"
          description: "Given names (not always 'first'). Includes middle names"
          example: "Joey"
        prefix:
          type:
          - "string"
          - "null"
          description: "Name prefix / title (e.g. Mr, Mrs, Dr)"
          example: "Mr"
      required:
      - "family"
      - "given"
      - "prefix"
      additionalProperties: false
    RelatedPersonContact:
      type: "object"
      properties:
        system:
          type: "string"
          enum:
          - "phone"
          - "fax"
          - "email"
          - "pager"
          - "sms"
          - "other"
          - "url"
          description: "phone | fax | email | pager | url | sms | other - type of\
            \ contact point"
          example: "phone"
        use:
          type: "string"
          enum:
          - "home"
          - "work"
          - "mobile"
          description: "home | work | mobile - purpose of this contact point"
          example: "home"
        rank:
          type:
          - "number"
          - "null"
          exclusiveMinimum: 0
          description: "Specify preferred order of use (1 = highest)"
          example: 1
        value:
          type:
          - "string"
          - "null"
          description: "The actual contact point details"
          example: "0412345678"
      required:
      - "system"
      - "use"
      - "rank"
      - "value"
      additionalProperties: false
    RelatedPersonAddress:
      type: "object"
      properties:
        city:
          type:
          - "string"
          - "null"
          description: "Name of city, town etc."
          example: "Brisbane | West End"
        line:
          type: "array"
          items:
            type:
            - "string"
            - "null"
            description: "Street name, number, direction & P.O. Box etc. The first\
              \ entry is line 1 of the address. All remaining entries will be joined\
              \ into line 2"
            example: "100 Test St"
        postalCode:
          type:
          - "string"
          - "null"
          description: "Postal code for area"
          example: "4000"
        state:
          type:
          - "string"
          - "null"
          enum:
          - "ACT"
          - "NSW"
          - "NT"
          - "QLD"
          - "SA"
          - "TAS"
          - "VIC"
          - "WA"
          description: "Sub-unit of country (abbreviations ok)"
          example: "QLD"
        use:
          type: "string"
          enum:
          - "home"
          - "work"
          - "billing"
          - "temp"
          - "old"
          description: "home | work | temp | old | billing - purpose of this address"
          example: "home"
        type:
          type: "string"
          enum:
          - "postal"
          - "physical"
          - "both"
          description: "postal | physical | both - type of this address"
          example: "postal"
      required:
      - "city"
      - "line"
      - "postalCode"
      - "state"
      - "use"
      - "type"
      additionalProperties: false
    Identifier:
      type: "object"
      properties:
        type:
          type: "string"
          enum:
          - "mc"
          - "pen"
          - "dvau"
          - "dvg"
          - "dvo"
          - "dvw"
          - "hc"
          - "mb"
          description: "Type of identifier"
          example: "mc"
        system:
          type: "string"
          description: "References the standard system used for the identifier"
          example: "http://ns.electronichealth.net.au/id/medicare-number"
        value:
          type:
          - "string"
          - "null"
          description: "Actual identifier info"
          example: "8003608833357360"
        assigner:
          type:
          - "string"
          - "null"
          enum:
          - "aca"
          - "ahb"
          - "ahm"
          - "ama"
          - "auf"
          - "bup"
          - "cbc"
          - "cbh"
          - "cdh"
          - "cps"
          - "fai"
          - "gmh"
          - "hbf"
          - "hcf"
          - "hci"
          - "hif"
          - "lhm"
          - "lhs"
          - "mbp"
          - "mdh"
          - "myo"
          - "nhb"
          - "nib"
          - "ntf"
          - "omf"
          - "pwa"
          - "qch"
          - "qtu"
          - "rbh"
          - "rte"
          - "slm"
          - "spe"
          - "sps"
          - "wfd"
          description: "Body responsible for issuing the identifier if specified"
          example: "aca"
        period:
          type: "object"
          properties:
            end:
              type:
              - "string"
              - "null"
              description: "End date of the identifier"
              example: "2000-01-01"
          additionalProperties: false
        extension:
          type: "array"
          items:
            type: "object"
            properties:
              system:
                type: "string"
                enum:
                - "individual-reference-number"
              valueInteger:
                type: "number"
                exclusiveMinimum: 0
                minimum: 1
                description: "The IRN for the patient on their medicare card."
                example: 1
            required:
            - "system"
            - "valueInteger"
            additionalProperties: false
      required:
      - "type"
      - "system"
      - "period"
      additionalProperties: false
    RelatedPersonIdentifier:
      allOf:
      - $ref: "#/components/schemas/Identifier"
      - type: "object"
        properties:
          type:
            type: "string"
            enum:
            - "mc"
        additionalProperties: false
    RelatedPerson:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        entityType:
          type:
          - "string"
          - "null"
          enum:
          - "business"
          - "individual"
        holderType:
          type: "string"
          enum:
          - "patient"
          - "contact"
        primary:
          type: "boolean"
        birthDate:
          type:
          - "string"
          - "null"
        name:
          $ref: "#/components/schemas/RelatedPersonName"
        contact:
          type:
          - "array"
          - "null"
          items:
            $ref: "#/components/schemas/RelatedPersonContact"
        address:
          type:
          - "array"
          - "null"
          items:
            $ref: "#/components/schemas/RelatedPersonAddress"
        identifier:
          type:
          - "array"
          - "null"
          items:
            $ref: "#/components/schemas/RelatedPersonIdentifier"
        contactType:
          type:
          - "string"
          - "null"
          enum:
          - "Hospital"
          - "Practitioner"
          - "AccountHolder"
          - "HealthFundContact"
          - "GenericContact"
          description: "Type/classification of the related person"
          example: "AccountHolder"
      required:
      - "id"
      - "entityType"
      - "holderType"
      - "primary"
      - "birthDate"
      - "name"
      - "contact"
      - "address"
      - "identifier"
      - "contactType"
      additionalProperties: false
    CancelAppointment:
      type: "object"
      properties:
        action:
          type: "string"
          enum:
          - "cancel"
        payload:
          type: "object"
          properties:
            cancellationReason:
              type: "object"
              properties:
                text:
                  type: "string"
                  minLength: 1
                  maxLength: 200
                  description: "The reason that the patient is cancelling the appointment.\
                    \ **This reason will be added to the notes of an appointment.**\n\
                    | **Note (Before)** | **Note (After)** |\n|-------------------|------------------|\n\
                    | Patient has hearing difficulty. | Cancellation reason: Patient\
                    \ cancelled due to illness.<br><br>Patient has hearing difficulty.\
                    \ |"
                  example: "Cancellation reason: Patient cancelled due to illness"
              required:
              - "text"
      required:
      - "action"
    UpdateAppointment:
      oneOf:
      - $ref: "#/components/schemas/CancelAppointment"
      discriminator:
        propertyName: "action"
        mapping:
          cancel: "#/components/schemas/CancelAppointment"
    ContactAddress:
      type: "object"
      properties:
        city:
          type:
          - "string"
          - "null"
          description: "City or suburb of the address"
          example: "Brisbane"
        line:
          type:
          - "array"
          - "null"
          items:
            type:
            - "string"
            - "null"
            description: "Street details of the address. The first entry is line 1,\
              \ remaining entries are joined into line 2."
            example: "100 Test St"
          description: "Street address lines"
        postalCode:
          type:
          - "string"
          - "null"
          description: "Postcode of the address"
          example: "4000"
        state:
          type:
          - "string"
          - "null"
          enum:
          - "ACT"
          - "NSW"
          - "NT"
          - "QLD"
          - "SA"
          - "TAS"
          - "VIC"
          - "WA"
          description: "Australian state or territory"
          example: "QLD"
        type:
          type: "string"
          enum:
          - "physical"
          description: "Type of the address. Only 'physical' is accepted."
          example: "physical"
        use:
          type: "string"
          enum:
          - "work"
          description: "Purpose of the address. Only 'work' is accepted for account\
            \ holder contacts."
          example: "work"
      required:
      - "use"
      additionalProperties: false
    ContactPoint:
      type: "object"
      properties:
        rank:
          type:
          - "number"
          - "null"
          description: "Preferred order of contact points (lower is higher priority)"
          example: 1
        system:
          type: "string"
          enum:
          - "phone"
          - "fax"
          - "email"
          description: "Type of contact point: phone | fax | email"
          example: "email"
        use:
          type: "string"
          enum:
          - "mobile"
          - "work"
          description: "Context of the contact point: work | mobile"
          example: "mobile"
        value:
          type: "string"
          description: "The actual contact point value (phone number, email, etc.)"
          example: "test@example.com"
      required:
      - "system"
      - "value"
      additionalProperties: false
    ContactIdentifier:
      type: "object"
      properties:
        extension:
          type: "array"
          items:
            type: "object"
            properties:
              system:
                type: "string"
                enum:
                - "individual-reference-number"
                description: "Must be 'individual-reference-number'"
              valueInteger:
                type: "integer"
                minimum: 1
                maximum: 9
                description: "Individual Reference Number (IRN) on the Medicare card.\
                  \ Must be a single digit between 1 and 9."
                example: 1
            required:
            - "system"
            - "valueInteger"
            additionalProperties: false
          description: "Extensions for the identifier (e.g. IRN for Medicare)"
        period:
          type: "object"
          properties:
            end:
              type:
              - "string"
              - "null"
              description: "Expiry date of the identifier"
              example: "2030-06-30"
          additionalProperties: false
        system:
          type: "string"
          description: "The namespace for the identifier value"
          example: "https://developer.digitalhealth.gov.au/namespaces/id/medicare-number/index.html"
        type:
          type: "string"
          enum:
          - "mc"
        value:
          type: "string"
          description: "The Medicare card number (exactly 10 digits)"
          example: "2123456701"
      required:
      - "period"
      - "system"
      - "type"
      - "value"
      additionalProperties: false
    ContactHumanName:
      type: "object"
      properties:
        family:
          type:
          - "string"
          - "null"
          description: "Family name (surname). Required when entityType is 'individual'."
          example: "Smith"
        given:
          type:
          - "string"
          - "null"
          description: "Given name (first name). Required when entityType is 'individual'."
          example: "John"
        prefix:
          type:
          - "string"
          - "null"
          description: "Name prefix / title (e.g. Mr, Mrs, Dr)"
          example: "Mr"
      additionalProperties: false
    DVA Card (Gold):
      type: "object"
      properties:
        extension:
          type: "array"
          items:
            oneOf:
            - type: "object"
              properties:
                system:
                  type: "string"
                  enum:
                  - "card-name"
                valueHumanName:
                  type: "object"
                  properties:
                    family:
                      type: "string"
                      minLength: 1
                      description: "DVA Card holders family name (as shown on the\
                        \ card)."
                      example: "Doe"
                    given:
                      type: "string"
                      minLength: 1
                      description: "DVA Card holders given name (as shown on the card)."
                      example: "John"
              required:
              - "system"
              - "valueHumanName"
        period:
          type: "object"
          properties:
            end:
              type: "string"
              description: "End, must be a future date, in the format YYYY-MM."
              example: "2000-01"
          required:
          - "end"
        system:
          type: "string"
          enum:
          - "https://developer.digitalhealth.gov.au/namespaces/id/dva/index.html"
          description: "References the standard system used for the identifier."
          example: "https://developer.digitalhealth.gov.au/namespaces/id/dva/index.html"
        value:
          type: "string"
          description: "DVA Card number"
          example: "WA123456A"
        type:
          type: "string"
          enum:
          - "dvg"
          description: "DVA Gold Card"
          example: "dvg"
      required:
      - "extension"
      - "period"
      - "system"
      - "value"
      - "type"
    DVA Card (Orange):
      type: "object"
      properties:
        extension:
          type: "array"
          items:
            oneOf:
            - type: "object"
              properties:
                system:
                  type: "string"
                  enum:
                  - "card-name"
                valueHumanName:
                  type: "object"
                  properties:
                    family:
                      type: "string"
                      minLength: 1
                      description: "DVA Card holders family name (as shown on the\
                        \ card)."
                      example: "Doe"
                    given:
                      type: "string"
                      minLength: 1
                      description: "DVA Card holders given name (as shown on the card)."
                      example: "John"
              required:
              - "system"
              - "valueHumanName"
        period:
          type: "object"
          properties:
            end:
              type: "string"
              description: "End, must be a future date, in the format YYYY-MM."
              example: "2000-01"
          required:
          - "end"
        system:
          type: "string"
          enum:
          - "https://developer.digitalhealth.gov.au/namespaces/id/dva/index.html"
          description: "References the standard system used for the identifier."
          example: "https://developer.digitalhealth.gov.au/namespaces/id/dva/index.html"
        value:
          type: "string"
          description: "DVA Card number"
          example: "WA123456A"
        type:
          type: "string"
          enum:
          - "dvo"
          description: "DVA Orange Card"
          example: "dvo"
      required:
      - "extension"
      - "period"
      - "system"
      - "value"
      - "type"
    DVA Card (Unknown):
      type: "object"
      properties:
        extension:
          type: "array"
          items:
            oneOf:
            - type: "object"
              properties:
                system:
                  type: "string"
                  enum:
                  - "card-name"
                valueHumanName:
                  type: "object"
                  properties:
                    family:
                      type: "string"
                      minLength: 1
                      description: "DVA Card holders family name (as shown on the\
                        \ card)."
                      example: "Doe"
                    given:
                      type: "string"
                      minLength: 1
                      description: "DVA Card holders given name (as shown on the card)."
                      example: "John"
              required:
              - "system"
              - "valueHumanName"
        period:
          type: "object"
          properties:
            end:
              type: "string"
              description: "End, must be a future date, in the format YYYY-MM."
              example: "2000-01"
          required:
          - "end"
        system:
          type: "string"
          enum:
          - "https://developer.digitalhealth.gov.au/namespaces/id/dva/index.html"
          description: "References the standard system used for the identifier."
          example: "https://developer.digitalhealth.gov.au/namespaces/id/dva/index.html"
        value:
          type: "string"
          description: "DVA Card number"
          example: "WA123456A"
        type:
          type: "string"
          enum:
          - "dvau"
          description: "DVA Card (no type)"
          example: "dvau"
      required:
      - "extension"
      - "period"
      - "system"
      - "value"
      - "type"
    DVA Card (White):
      type: "object"
      properties:
        extension:
          type: "array"
          items:
            oneOf:
            - type: "object"
              properties:
                system:
                  type: "string"
                  enum:
                  - "card-name"
                valueHumanName:
                  type: "object"
                  properties:
                    family:
                      type: "string"
                      minLength: 1
                      description: "DVA Card holders family name (as shown on the\
                        \ card)."
                      example: "Doe"
                    given:
                      type: "string"
                      minLength: 1
                      description: "DVA Card holders given name (as shown on the card)."
                      example: "John"
              required:
              - "system"
              - "valueHumanName"
            - type: "object"
              properties:
                system:
                  type: "string"
                  enum:
                  - "condition"
                valueString:
                  type: "string"
                  minLength: 1
                  maxLength: 100
                  description: "Specific medical condition(s) for the card."
                  example: "Post-traumatic stress disorder (PTSD)"
              required:
              - "system"
              - "valueString"
        period:
          type: "object"
          properties:
            end:
              type: "string"
              description: "End, must be a future date, in the format YYYY-MM."
              example: "2000-01"
          required:
          - "end"
        system:
          type: "string"
          enum:
          - "https://developer.digitalhealth.gov.au/namespaces/id/dva/index.html"
          description: "References the standard system used for the identifier."
          example: "https://developer.digitalhealth.gov.au/namespaces/id/dva/index.html"
        value:
          type: "string"
          description: "DVA Card number"
          example: "WA123456A"
        type:
          type: "string"
          enum:
          - "dvw"
          description: "DVA White Card"
          example: "dvw"
      required:
      - "extension"
      - "period"
      - "system"
      - "value"
      - "type"
    Healthcare Concession Card:
      type: "object"
      properties:
        period:
          type: "object"
          properties:
            end:
              type: "string"
              description: "End must be a future date, in the format YYYY-MM-DD."
              example: "2000-01-01"
          required:
          - "end"
        system:
          type: "string"
          enum:
          - "https://developer.digitalhealth.gov.au/namespaces/id/centrelink-customer-reference-number/index.html"
          description: "References the standard system used for the identifier."
          example: "https://developer.digitalhealth.gov.au/namespaces/id/centrelink-customer-reference-number/index.html"
        type:
          type: "string"
          enum:
          - "hc"
          description: "Health Care Card"
          example: "hc"
        value:
          type: "string"
          description: "Centerlink CRN (customer reference number)."
          example: "123456789A"
      required:
      - "period"
      - "system"
      - "type"
      - "value"
    Pensioner Concession Card:
      type: "object"
      properties:
        period:
          type: "object"
          properties:
            end:
              type: "string"
              description: "End must be a future date, in the format YYYY-MM-DD."
              example: "2000-01-01"
          required:
          - "end"
        system:
          type: "string"
          enum:
          - "https://developer.digitalhealth.gov.au/namespaces/id/centrelink-customer-reference-number/index.html"
          description: "References the standard system used for the identifier."
          example: "https://developer.digitalhealth.gov.au/namespaces/id/centrelink-customer-reference-number/index.html"
        type:
          type: "string"
          enum:
          - "pen"
          description: "Pensioner Concession Card"
          example: "pen"
        value:
          type: "string"
          description: "Centerlink CRN (customer reference number)."
          example: "123456789A"
      required:
      - "period"
      - "system"
      - "type"
      - "value"
    Private Insurance Member:
      type: "object"
      properties:
        assigner:
          type:
          - "string"
          - "null"
          enum:
          - "aca"
          - "ahb"
          - "ahm"
          - "ama"
          - "auf"
          - "bup"
          - "cbc"
          - "cbh"
          - "cdh"
          - "cps"
          - "fai"
          - "gmh"
          - "hbf"
          - "hcf"
          - "hci"
          - "hif"
          - "lhm"
          - "lhs"
          - "mbp"
          - "mdh"
          - "myo"
          - "nhb"
          - "nib"
          - "ntf"
          - "omf"
          - "pwa"
          - "qch"
          - "qtu"
          - "rbh"
          - "rte"
          - "slm"
          - "spe"
          - "sps"
          - "wfd"
          description: "Body responsible for issuing the identifier if specified.\
            \ Please use URL at `system` to reference."
          example: "aca"
        extension:
          type: "array"
          items:
            oneOf:
            - type: "object"
              properties:
                system:
                  type: "string"
                  enum:
                  - "member-reference"
                valueInteger:
                  type: "number"
                  exclusiveMinimum: 0
                  minimum: 0
                  description: "Private Health Card member's reference number."
                  example: 1
              required:
              - "system"
              - "valueInteger"
            - type: "object"
              properties:
                system:
                  type: "string"
                  enum:
                  - "member-name"
                valueHumanName:
                  type: "object"
                  properties:
                    family:
                      type:
                      - "string"
                      - "null"
                      description: "Private Health Card member's family name."
                      example: "Doe"
                    given:
                      type:
                      - "string"
                      - "null"
                      description: "Private Health Card member's given name."
                      example: "John"
              required:
              - "system"
              - "valueHumanName"
        period:
          type: "object"
          properties:
            end:
              type: "string"
              description: "End must be a future date, in the format YYYY-MM."
              example: "2000-01"
          required:
          - "end"
        system:
          type: "string"
          enum:
          - "https://www.privatehealth.gov.au/dynamic/insurer"
          description: "References the standard system used for the identifier."
          example: "https://www.privatehealth.gov.au/dynamic/insurer"
        type:
          type: "string"
          enum:
          - "mb"
          description: "Private Health Card"
          example: "mb"
        value:
          type: "string"
          pattern: "^[a-zA-Z0-9]+$"
          description: "Private Health Card number."
          example: "12345678"
