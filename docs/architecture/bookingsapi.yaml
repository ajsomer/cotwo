  /v1/tenants/{tenantId}/appointments:
    post:
      security:
      - OAuth2: []
      description: "Create an Appointment."
      parameters: []
      x-apps-api:
        lambdaName: "@lambdas/post-appointments"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                appointmentTypeId:
                  type: "string"
                  format: "uuid"
                  description: "Appointment Type ID of the appointment."
                  example: "0adac388-a637-474d-8a77-eaaa01158c1e"
                duration:
                  type: "integer"
                  minimum: 0
                  description: "Duration of the appointment in minutes."
                  example: 15
                notes:
                  type: "string"
                patientId:
                  type: "string"
                  format: "uuid"
                  description: "Patient ID for the Patient attending the appointment."
                  example: "d3acc047-aa03-428f-8cc7-55fc7cfc1d5b"
                practitionerId:
                  type: "string"
                  format: "uuid"
                  description: "Practitioner ID whom the appointment is with."
                  example: "b3c7c80d-7148-4ff5-90f1-438a9be8d279"
                siteOfServiceId:
                  type: "string"
                  format: "uuid"
                  description: "Site of Service ID of the appointment."
                  example: "fb5f0949-875e-4a35-9719-5727f3179651"
                startsAt:
                  type: "string"
                  format: "date-time"
                  description: "Start time for the appointment"
                  example: "2000-01-01T00:00:00.000+10:00"
                status:
                  type: "string"
                  enum:
                  - "none"
                  - "confirmed"
                  - "completed"
                  - "in_waiting_room"
                  - "with_doctor"
                  - "invoiced"
                  - "cancelled"
                  - "did_not_arrive"
                  default: "none"
                  description: "Status of the appointment.\n\n### Guidelines\n\n1.\
                    \ **None**: No appointment status has been assigned yet. Default\
                    \ applied when appointment created. All new appointments should\
                    \ be created as None.\n\n2. **Confirmed**: The appointment has\
                    \ been confirmed by the patient or by the practice on behalf of\
                    \ the patient.\n\n3. **Completed**: The appointment has taken\
                    \ place, and the patient has been seen by the healthcare provider.\n\
                    \n4. **In Waiting Room**: The patient has arrived at the clinic\
                    \ or tele-health waiting room and is waiting to be seen.\n\n5.\
                    \ **With Doctor**: The patient is currently with the healthcare\
                    \ provider for their consultation.\n\n6. **Invoiced**: The appointment\
                    \ has been completed, and an invoice has been generated for the\
                    \ services provided.\n\n7. **Cancelled**: The appointment has\
                    \ been cancelled by either the patient or the clinic on behalf\
                    \ of the patient.\n\n8. **Did Not Arrive**: The patient did not\
                    \ show up for the scheduled appointment."
                  example: "confirmed"
              required:
              - "appointmentTypeId"
              - "duration"
              - "patientId"
              - "practitionerId"
              - "startsAt"
              - "status"
      responses:
        "201":
          description: "Appointment successfully created."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                    format: "uuid"
                    description: "ID of the appointment."
                    example: "8555907e-540e-4315-8f01-a6912a75125c"
                required:
                - "id"
