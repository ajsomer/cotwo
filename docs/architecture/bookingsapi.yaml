        \ Insurance Member, or Medicare Card."
    Emergency Contact:
      type: "object"
      properties:
        relationship:
          type: "array"
          items:
            type: "object"
            properties:
              coding:
                type: "array"
                items:
                  type: "object"
                  properties:
                    code:
                      type: "string"
                      enum:
                      - "C"
                      - "N"
                      description: "Symbol in syntax defined by the system"
                      example: "C"
                    display:
                      type: "string"
                      description: "Representation defined by the system"
                      example: "Emergency Contact"
                  required:
                  - "code"
              text:
                type: "string"
                description: "Text representation of the relationship to the patient"
                example: "grandparent"
            required:
            - "coding"
          description: "The kind of relationship to patient\n| Coding | Text | Definition\
            \ |\n| -------- | ----------- | --------------- |\n| [{'code': 'C'}] |\
            \ 'grandparent' | Emergency Contact who is a grandparent |\n| [{'code':'C'},\
            \ {'code': 'N'}] | 'daughter' | Emergency Contact who is Next of Kin and\
            \ a daughter |\n\nThe following values are suggested:\nAunt, Brother,\
            \ Child, Cousin, Daughter, Dependent, Father, Grandchild, Grandfather,\
            \ Grandmother, Grandparent, Guardian, Husband, Mother, Nephew, Niece,\
            \ Parent, Partner, Sibling, Sister, Son, Spouse, Uncle, Wife."
          example:
          - coding:
            - code: "C"
            - code: "N"
            text: "daughter"
        name:
          type: "object"
          properties:
            given:
              type: "string"
