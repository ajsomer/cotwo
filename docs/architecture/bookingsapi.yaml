                          - "home"
                          - "work"
                          - "mobile"
                        value:
                          type: "string"
                      required:
                      - "system"
                      - "value"
                      additionalProperties: false
                  holderType:
                    type: "string"
                    enum:
                    - "contact"
                    - "patient"
                  id:
                    type: "string"
                    format: "uuid"
                  primary:
                    type: "boolean"
                  assistant:
                    type:
                    - "boolean"
                    - "null"
                  contactMethod:
                    type: "string"
                    enum:
                    - "email"
                    - "fax"
                    - "healthlink"
                    - "mail"
                    - "medical_objects"
                  contactType:
                    type: "string"
                    enum:
                    - "Practitioner"
                  entityType:
                    type: "string"
                    enum:
                    - "individual"
                  healthlink:
                    type:
                    - "string"
                    - "null"
                  medicalObjects:
                    type:
                    - "string"
                    - "null"
                  name:
                    type: "object"
                    properties:
                      family:
                        type: "string"
                      given:
                        type: "string"
                      prefix:
                        type:
                        - "string"
                        - "null"
                      text:
                        type:
                        - "string"
                        - "null"
                    required:
                    - "family"
                    - "given"
                    additionalProperties: false
                  providerNumber:
                    type: "string"
                  specialtyCode:
                    type: "string"
                required:
                - "contactType"
                - "entityType"
                - "name"
                additionalProperties: false
      responses:
        "201":
          description: "Contact created successfully."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                    format: "uuid"
                    description: "ID of the Contact created"
                    example: "ce64c193-ec3c-4872-b940-1fc5ccb8826b"
                required:
                - "id"
  /v1/tenants/{tenantId}/patients:
    post:
      security:
      - OAuth2: []
      description: "Create a new patient\n- Patient names can be provided via name.given\
        \ (combined) or via extension entries (individually). These modes are mutually\
        \ exclusive — do not mix name.given with firstname/middlename extensions in\
        \ the same request.\n- Extension-based naming: 'firstname' is required; 'middlename'\
        \ is optional. Providing name.given alongside either extension entry will\
        \ fail validation.\n- Additional name fields supported via extension: 'maiden-name'\
        \ and 'pronouns'."
      parameters:
      - $ref: "#/components/parameters/TenantIdParameter"
      x-apps-api:
        lambdaName: "@lambdas/post-create-patient"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                address:
                  type: "array"
                  items:
                    allOf:
                    - $ref: "#/components/schemas/Address"
                    - properties:
                        city:
                          type:
                          - "string"
                          - "null"
                          description: "City or Suburb of the Address"
                          example: "Brisbane | West End"
                        line:
                          type: "array"
                          items:
                            type:
                            - "string"
                            - "null"
                            description: "Street details of the Address. The first\
                              \ entry is line 1 of the address. All remaining entries\
                              \ will be joined into line 2"
                            example: "100 Test St"
                        postalCode:
                          type:
                          - "string"
                          - "null"
                          description: "Postcode of the Address"
                          example: "4000"
                        state:
                          type:
                          - "string"
                          - "null"
                          enum:
                          - "ACT"
                          - "NSW"
                          - "NT"
                          - "QLD"
                          - "SA"
                          - "TAS"
                          - "VIC"
                          - "WA"
                          description: "State of the Address"
                          example: "QLD"
                        use:
                          type: "string"
                          enum:
                          - "home"
                          - "work"
                          description: "Name identifier (label) of this Address. Only\
                            \ accept home for now"
                          example: "home"
                        type:
                          type: "string"
                          enum:
                          - "postal"
                          - "physical"
                          - "both"
                          description: "Type of the Address. postal | physical | both"
                          example: "postal"
                birthDate:
                  type: "string"
                  description: "Date of birth of the Patient being created."
                  example: "2000-01-01"
                contact:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      system:
                        type: "string"
                        enum:
                        - "email"
                        - "phone"
                        description: "Type of the Contact"
                        example: "phone"
                      use:
                        type: "string"
                        enum:
                        - "home"
                        - "work"
                        - "mobile"
                        description: "Use of the Contact"
                        example: "home"
                      rank:
                        type: "number"
                        exclusiveMinimum: 0
                        description: "Rank indicates what order the Contact should\
                          \ be used in, the lowest number is the highest priority.\
                          \ Must be a positive number."
                        example: 1
                      value:
                        type: "string"
                        description: "Value of the Contact"
                        example: "0412345678"
                    required:
                    - "system"
                    - "use"
                    - "rank"
                    - "value"
                  minItems: 1
                  description: "Atleast one of mobile or email should be provided"
                gender:
                  type: "string"
                  enum:
                  - "female"
                  - "male"
                  - "unspecified"
                  description: "Gender of the Patient"
                  example: "male"
                identifier:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      value:
                        type: "string"
                        description: "Actual identifier info"
                        example: "8003608833357360"
                      type:
                        type: "string"
                        enum:
                        - "mc"
                        - "pen"
                        - "dvau"
                        - "dvg"
                        - "dvo"
                        - "dvw"
                        - "hc"
                        - "mb"
                        description: "| Value | Definition |\n|-------|------------|\n\
                          | mc    | Medicare Card - currently supports only Medicare\
                          \ |"
                        example: "mc"
                      system:
                        type: "string"
                        description: "| Type | System |\n|-------|------------|\n\
                          | mc | https://developer.digitalhealth.gov.au/namespaces/id/medicare-number/index.html\
                          \  |"
                        example: "https://developer.digitalhealth.gov.au/namespaces/id/medicare-number/index.html"
                      period:
                        type: "object"
                        properties:
                          end:
                            type: "string"
                            description: "Expiry date of the identifier, please enter\
                              \ `01` as the day if unknown. Date must not be in the\
                              \ past."
                            example: "2000-01-01"
                        required:
                        - "end"
                    required:
                    - "value"
                    - "type"
                    - "system"
                    - "period"
                  description: "List of identifiers for the patient, currently supports\
                    \ only medicare"
                extension:
                  type: "array"
                  items:
                    oneOf:
                    - type: "object"
                      properties:
                        system:
                          type: "string"
                          enum:
                          - "firstname"
                        valueString:
                          type: "string"
                          minLength: 1
                          description: "Patient's first name"
                          example: "Joey"
                      required:
                      - "system"
                      - "valueString"
                    - type: "object"
                      properties:
                        system:
                          type: "string"
                          enum:
                          - "maiden-name"
                        valueString:
                          type: "string"
                          minLength: 1
                          description: "Patient's maiden name"
                          example: "Johnson"
                      required:
                      - "system"
                      - "valueString"
                    - type: "object"
                      properties:
                        system:
                          type: "string"
                          enum:
                          - "middlename"
                        valueString:
                          type: "string"
                          minLength: 1
                          description: "Patient's middle name"
                          example: "Michael"
                      required:
                      - "system"
                      - "valueString"
                    - type: "object"
                      properties:
                        system:
                          type: "string"
                          enum:
                          - "pronouns"
                        valueString:
                          type: "string"
                          enum:
                          - "any"
                          - "he/him"
                          - "he/they"
                          - "she/her"
                          - "she/they"
                          - "they/them"
                          description: "Patient's pronouns"
                          example: "he/him"
                      required:
                      - "system"
                      - "valueString"
                  description: "Additional patient name fields. Use 'firstname' (required\
                    \ when using extension-based naming) and optionally 'middlename'\
                    \ to set name fields individually instead of name.given. Also\
                    \ supports 'maiden-name' and 'pronouns'."
                name:
                  type: "object"
                  properties:
                    family:
                      type: "string"
                      description: "Family name"
                      example: "Tribbiani"
                    given:
                      type: "string"
                      description: "NOTE: prefer using 'firstname' and 'middlename'\
                        \ within 'extension' for more predictable control over name\
                        \ fields. Given name/s, will be split in first and middle\
                        \ names if present e.g. first name: `Joey` & middle name:\
                        \ `Doe Boe`"
                      example: "Joey Doe Boe"
                    prefix:
                      type: "string"
                      description: "Prefix for name"
                      example: "Mr"
                  required:
                  - "family"
                  description: "Name of the patient"
                deceased:
                  type: "object"
                  properties:
                    deceasedBoolean:
                      type: "boolean"
                      description: "Indicates if the Patient is deceased."
                      example: true
                    deceasedDateTime:
                      type: "string"
                      format: "date-time"
                      description: "Date and time of death of the Patient."
                      example: "2000-01-01T00:00:00.000+00:00+10:00"
                  required:
                  - "deceasedBoolean"
                occupation:
                  type: "string"
                  description: "Occupation of the Patient"
                  example: "Doctor"
                indigenousStatus:
                  type: "string"
                  enum:
                  - "aboriginal"
                  - "torres_strait_islander"
                  - "both"
                  - "neither"
                  - "declined"
                  description: "Indigenous Status of the Patient"
                  example: "aboriginal"
              required:
              - "birthDate"
              - "contact"
              - "name"
      responses:
        "201":
          description: "Patient created successfully."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                    format: "uuid"
                    description: "ID of the Patient created"
                    example: "ce64c193-ec3c-4872-b940-1fc5ccb8826b"
                required:
                - "id"
  /v1/tenants/{tenantId}/patients/{patientId}/incoming-correspondence:
    post:
      security:
      - OAuth2: []
      description: "Creates an incoming correspondence with attachments.\n\n Incoming\
        \ correspondence is a central ‘inbox’ to receive any written communication\
        \ received by the practice, such as referral letters or updates from other\
        \ healthcare providers. This information is typically triaged, reviewed and\
        \ added to the patient's file (if not already done automatically) for reference\
        \ and follow-up."
      parameters:
      - $ref: "#/components/parameters/TenantIdParameter"
      - $ref: "#/components/parameters/PatientIdParameter"
      - schema:
          type: "string"
          format: "uuid"
          description: "Provide practitioner id. Practitioner must be a billing provider."
          example: "b3c7c80d-7148-4ff5-90f1-438a9be8d279"
        required: false
        name: "practitionerId"
        in: "query"
      - schema:
          type: "string"
          maxLength: 100
          description: "Name and title of the person sending referral. This is displayed\
            \ in Gentu UI."
          example: "Dr. Strange Cow"
        required: false
        name: "referringProviderName"
        in: "query"
      x-apps-api:
        lambdaName: "@lambdas/post-create-incoming-correspondence"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: "string"
              minLength: 1
              description: "Attach your files here. The files must be in one of the\
                \ `jpeg|jpg`, `png` or `pdf`. Combined size of the files should not\
                \ exceed 4MB.\n\nProvide file name with extension.\n\n\n\n**Important:\
                \ The name field in the metadata should always include the file extension.**"
              example: "test report.pdf"
      responses:
        "200":
          description: "Incoming correspondence accepted and is being processed. It\
            \ is an asynchronous operation. Check the status of the operation using\
            \ the attatchment status endpoint (/tenants/{tenantId}/patients/{patientId}/attachments/{attachmentId})."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                    format: "uuid"
                    description: "Incoming Correspondence ID"
                    example: "d24bbd9e-7699-4103-b981-e55df0f2225f"
                required:
                - "id"
  /v1/tenants/{tenantId}/patients/list:
    post:
      security:
      - OAuth2: []
      description: "Retrieves a list of Patients.\n\nTo query for a list of Patients\
        \ you must provide at least 1 filter, additionally we have implemented sparse\
        \ fields and require that you specify what fields you require access to in\
        \ the returned Patient objects.\n\nThis is a non-standard REST List (or Index)\
        \ endpoint, it lives on the POST method and uses a request body instead of\
        \ GET with query string parameters. This helps to protect against unwanted\
        \ or unintended logging of PHI which would otherwise be passed as query string\
        \ parameters. "
      parameters: []
      x-apps-api:
        lambdaName: "@lambdas/post-list-patients"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                fields:
                  type: "array"
                  items:
                    type: "string"
                    enum:
                    - "address"
                    - "birthDate"
                    - "contact"
                    - "deceased"
                    - "extension"
                    - "gender"
                    - "identifier"
                    - "indigenousStatus"
                    - "name"
                    - "occupation"
                  description: "A list of the top level fields of the Patient object\
                    \ to include for each resource, by default \"id\" is always included.\
                    \ Any fields not provided will not be returned in the resources\
                    \ returned."
                  example:
                  - "address"
                  - "name"
                filters:
                  type: "object"
                  properties:
                    birthDate:
                      type: "string"
                    email:
                      type: "string"
                      format: "email"
                    familyName:
                      type: "string"
                      minLength: 1
                    firstName:
                      type: "string"
                      minLength: 1
                    gender:
                      type: "string"
                      enum:
                      - "female"
                      - "male"
                      - "unspecified"
                    medicareCardNumber:
                      type: "string"
                    middleName:
                      type: "string"
                      minLength: 1
                    mobilePhone:
                      type: "string"
                  additionalProperties: false
                  description: "A list of filters, you must provide at least one of:\
                    \ \"birthDate\", \"email\", \"familyName\", \"medicareCardNumber\"\
                    , \"mobilePhone\", in addition to any others."
                  example:
                    email: "patient@practice.com"
                pagination:
                  type: "object"
                  properties:
                    cursor:
                      type: "string"
                      description: "Resource to start at."
                      example: "WyIyMDI2LTA1LTI2VDA5OjUwOjEyLjE4NTk2MysxMDowMCIsIjhjMGIyZmI0LTA3OTgtNGFiMC1hYjJiLWFkNTMxOTJiYTVlNCJd"
                    limit:
                      type: "integer"
                      minimum: 5
                      maximum: 100
                      description: "Number of Patients to retrieve per page."
                      example: 5
                  required:
                  - "limit"
                  additionalProperties: false
              required:
              - "filters"
              - "pagination"
              additionalProperties: false
      responses:
        "200":
          description: "Patients successfully retrieved."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  pagination:
                    type: "object"
                    properties:
                      limit:
                        type: "integer"
                        minimum: 5
                        maximum: 100
                      next:
                        type:
                        - "string"
                        - "null"
                      previous:
                        type:
                        - "string"
                        - "null"
                      total:
                        type: "integer"
                        minimum: 0
                    required:
                    - "limit"
                    - "next"
                    - "previous"
                    - "total"
                    additionalProperties: false
                  patients:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Patient"
                required:
                - "pagination"
                - "patients"
                additionalProperties: false
  /v1/tenants/{tenantId}/appointment-types:
