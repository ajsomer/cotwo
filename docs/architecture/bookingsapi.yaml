              example: "Joey Doe Boe"
            family:
              type: "string"
              minLength: 2
              description: "Family name of the contact"
              example: "Smith"
          required:
          - "given"
        telecom:
          type: "array"
          items:
            type: "object"
            properties:
              system:
                type: "string"
                enum:
                - "phone"
              use:
                type: "string"
                enum:
                - "mobile"
