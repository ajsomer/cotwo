  /v1/tenants/{tenantId}/practitioners/{practitionerId}/sites:
    get:
      security:
      - OAuth2: []
      description: "Returns a list of Sites of Service for a given Practitioner"
      parameters:
      - $ref: "#/components/parameters/TenantIdParameter"
      x-apps-api:
        lambdaName: "@lambdas/get-sites-of-service"
      responses:
        "200":
          description: "Sites of service successfully retrieved."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  data:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "string"
                          format: "uuid"
                        name:
                          type:
                          - "string"
                          - "null"
                      required:
                      - "id"
                      - "name"
                required:
                - "data"
  /v1/tenants/{tenantId}/users:
    get:
      security:
      - OAuth2: []
      description: "Retrieves a list of users."
      parameters:
      - $ref: "#/components/parameters/TenantIdParameter"
      x-apps-api:
        lambdaName: "@lambdas/get-users"
      responses:
        "200":
          description: "Users successfully retrieved."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ListUser"
webhooks: {}
