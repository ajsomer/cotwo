  /v1/tenants/{tenantId}/procedures:
    get:
      security:
      - OAuth2: []
      description: "Returns a list of procedures."
      parameters:
      - $ref: "#/components/parameters/TenantIdParameter"
      - schema:
          type: "string"
          description: "Comma delimited list of which relationships should be loaded.\
            \ Valid relationships: patients, practitioners, referrals"
          example: "patients,practitioners,referrals"
        required: false
        name: "include"
        in: "query"
      - schema:
          type: "string"
          format: "uuid"
          description: "Show procedures for the provided `patientId`, atleast one\
            \ of `patientId` or `practitionerId` must be provided"
          example: "b3c7c80d-7148-4ff5-90f1-438a9be8d279"
        required: false
        name: "patientId"
        in: "query"
      - schema:
          type: "string"
          format: "uuid"
          description: "Show procedures for the provided `practitionerId`, atleast\
            \ one of `patientId` or `practitionerId` must be provided"
          example: "b3c7c80d-7148-4ff5-90f1-438a9be8d279"
        required: false
        name: "practitionerId"
        in: "query"
      - schema:
          type: "string"
          description: "cursor to get next set of data"
          example: "2023-07-07T21:12:02+10:00"
        required: false
        name: "next"
        in: "query"
      - schema:
          type: "string"
          description: "cursor to get previous set of data"
          example: "2023-07-07T21:12:02+10:00"
        required: false
        name: "previous"
        in: "query"
      - schema:
          type: "string"
          description: "number of results to retrieve per page"
          example: 5
        required: true
        name: "limit"
        in: "query"
      - schema:
          type: "string"
          enum:
          - "true"
          - "false"
          description: "Procedures types\n| Value | Meaning |\n|-----------------|-----------------|\n\
            | true | Get all scheduled procedures |\n| false | Get all pending procedures\
            \ |\n| undefined | Get all scheduled and pending procedures |"
          example: "true"
        required: false
        name: "scheduled"
        in: "query"
      - schema:
          type: "string"
          format: "date-time"
          description: "Show Procedures that begin after the provided date time (ISO\
            \ 8601 with offset). Important: This field must be URI Encoded as it includes\
            \ symbols that will otherwise be stripped from the URL."
          example: "2000-01-01T00:00:00.000+10:00"
        required: false
        name: "fromDate"
        in: "query"
      - schema:
          type: "string"
          format: "date-time"
          description: "Show Procedures that begin before the provided date time (ISO\
            \ 8601 with offset). Important: This field must be URI Encoded as it includes\
            \ symbols that will otherwise be stripped from the URL."
          example: "2000-01-01T00:00:00.000+10:00"
        required: false
        name: "toDate"
        in: "query"
