  /v1/tenants/{tenantId}/patients/{patientId}:
    get:
      security:
      - OAuth2: []
      description: "Retrieves a patient by its ID."
      parameters:
      - $ref: "#/components/parameters/TenantIdParameter"
      - $ref: "#/components/parameters/PatientIdParameter"
      x-apps-api:
        lambdaName: "@lambdas/get-patients-by-id"
      responses:
        "200":
          description: "Patient successfully retrieved."
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/Patient"
                - properties:
                    id:
                      type: "string"
                      description: "The UUID of the Patient."
                      example: "128eb8c9-61c0-4b1b-9519-6bbb86bfe7aa"
                    address:
                      type:
                      - "array"
                      - "null"
                      items:
                        $ref: "#/components/schemas/Address"
                    birthDate:
                      type:
                      - "string"
                      - "null"
                      description: "Date of birth of the Patient."
                      example: "2000-01-01"
                    contact:
                      type: "array"
                      items:
                        $ref: "#/components/schemas/PatientContact"
                    gender:
                      type:
                      - "string"
                      - "null"
                      enum:
                      - "female"
                      - "male"
                      - "unspecified"
                      description: "Gender of the Patient"
                      example: "male"
                    identifier:
                      type: "array"
                      items:
                        allOf:
                        - $ref: "#/components/schemas/PatientIdentifier"
                        - properties:
                            type:
                              type: "string"
                              enum:
                              - "mc"
                              - "pen"
                              - "dvau"
                              - "dvg"
                              - "dvo"
                              - "dvw"
                              - "hc"
                              - "mb"
                              description: "| Value | Definition |\n|-------|------------|\n\
                                | mc    | Medicare Card |\n| pen   | Pensioner Concession\
                                \ Card |\n| dvau  | Department of Veterans’ Affairs\
                                \ - Unspecified Entitlement Card |\n| dvg   | Department\
                                \ of Veterans’ Affairs - Gold Entitlement Card |\n\
                                | dvo   | Department of Veterans’ Affairs - Orange\
                                \ Entitlement Card |\n| dvw   | Department of Veterans’\
                                \ Affairs - White Entitlement Card |\n| hc    | Health\
                                \ Care Card |\n| mb    | Private Insurance Member\
                                \ |"
                              example: "dvau"
                            system:
                              type: "string"
                              description: "References the standard system used for\
                                \ the identifier"
                              example: "http://ns.electronichealth.net.au/id/medicare-number"
                            value:
                              type:
                              - "string"
                              - "null"
                              description: "Actual identifier info"
                              example: "8003608833357360"
                            assigner:
                              type:
                              - "string"
                              - "null"
                              enum:
                              - "aca"
                              - "ahb"
                              - "ahm"
                              - "ama"
                              - "auf"
                              - "bup"
                              - "cbc"
                              - "cbh"
                              - "cdh"
                              - "cps"
                              - "fai"
                              - "gmh"
                              - "hbf"
                              - "hcf"
                              - "hci"
                              - "hif"
                              - "lhm"
                              - "lhs"
                              - "mbp"
                              - "mdh"
                              - "myo"
                              - "nhb"
                              - "nib"
                              - "ntf"
                              - "omf"
                              - "pwa"
                              - "qch"
                              - "qtu"
                              - "rbh"
                              - "rte"
                              - "slm"
                              - "spe"
                              - "sps"
                              - "wfd"
                              description: "Body responsible for issuing the identifier\
                                \ if specified"
                              example: "aca"
                            period:
                              type: "object"
                              properties:
                                end:
                                  type:
                                  - "string"
                                  - "null"
                                  description: "End date of the identifier"
                                  example: "2000-01-01"
                            extension:
                              type: "array"
                              items:
                                type: "object"
                                properties:
                                  system:
                                    type: "string"
                                    enum:
                                    - "individual-reference-number"
                                  valueInteger:
                                    type: "number"
                                    exclusiveMinimum: 0
                                    minimum: 1
                                    description: "The IRN for the patient on their\
                                      \ medicare card."
                                    example: 1
                                required:
                                - "system"
                                - "valueInteger"
                    name:
                      $ref: "#/components/schemas/PatientName"
                    deceased:
                      type:
                      - "object"
                      - "null"
                      properties:
                        deceasedBoolean:
                          type:
                          - "boolean"
                          - "null"
                          description: "Indicates if the Patient is deceased."
                          example: true
                        deceasedDateTime:
                          type:
                          - "string"
                          - "null"
                          description: "Date of death of the Patient."
                          example: "2000-01-01"
                      required:
                      - "deceasedBoolean"
                      - "deceasedDateTime"
                    occupation:
                      type:
                      - "string"
                      - "null"
                      description: "Occupation of the Patient"
                      example: "Doctor"
                    indigenousStatus:
                      type:
                      - "string"
                      - "null"
                      enum:
                      - "aboriginal"
                      - "torres_strait_islander"
                      - "both"
                      - "neither"
                      - "declined"
                      description: "Indigenous Status of the Patient"
                      example: "aboriginal"
                    chartNumber:
                      type:
                      - "string"
                      - "null"
                      description: "Practice-specific chart number for the patient."
                      example: "CHT001"
                    emailEnabled:
                      type: "boolean"
                      description: "Whether the patient has opted in to email contact."
                      example: true
                    smsEnabled:
                      type:
                      - "boolean"
                      - "null"
                      description: "Whether the patient has opted in to SMS contact."
                      example: true
                    extension:
                      type: "array"
                      items:
                        oneOf:
                        - type: "object"
                          properties:
                            system:
                              type: "string"
                              enum:
                              - "emergency-contacts"
                            valueArray:
                              type: "array"
                              items:
                                allOf:
                                - $ref: "#/components/schemas/Emergency Contact"
                                - properties:
                                    id:
                                      type: "string"
                                      format: "uuid"
                                    relationship:
                                      type: "array"
                                      items:
                                        type: "object"
                                        properties:
                                          coding:
                                            type: "array"
                                            items:
                                              type: "object"
                                              properties:
                                                code:
                                                  type: "string"
                                                  enum:
                                                  - "C"
                                                  - "N"
                                                  description: "Symbol in syntax defined\
                                                    \ by the system"
                                                  example: "C"
                                                display:
                                                  type: "string"
                                                  description: "Representation defined\
                                                    \ by the system"
                                                  example: "Emergency Contact"
                                              required:
                                              - "code"
                                          text:
                                            type:
                                            - "string"
                                            - "null"
                                            description: "Text representation of the\
                                              \ relationship to the patient"
                                            example: "grandparent"
                                        required:
                                        - "coding"
                                        - "text"
                                      description: "The kind of relationship to patient\n\
                                        | Coding | Text | Definition |\n| --------\
                                        \ | ----------- | --------------- |\n| [{'code':\
                                        \ 'C'}] | 'grandparent' | Emergency Contact\
                                        \ who is a grandparent |\n| [{'code':'C'},\
                                        \ {'code': 'N'}] | 'daughter' | Emergency\
                                        \ Contact who is Next of Kin and a daughter\
                                        \ |\n\nThe following values are commonly used\
                                        \ to indicate the relationship type:\nAunt,\
                                        \ Brother, Child, Cousin, Daughter, Dependent,\
                                        \ Father, Grandchild, Grandfather, Grandmother,\
                                        \ Grandparent, Guardian, Husband, Mother,\
                                        \ Nephew, Niece, Parent, Partner, Sibling,\
                                        \ Sister, Son, Spouse, Uncle, Wife."
                                      example:
                                      - coding:
                                        - code: "C"
                                        - code: "N"
                                        text: "daughter"
                                    name:
                                      type: "object"
                                      properties:
                                        given:
                                          type:
                                          - "string"
                                          - "null"
                                          description: "Given name/s"
                                          example: "Joey Doe Boe"
                                        family:
                                          type:
                                          - "string"
                                          - "null"
                                          description: "Family name of the contact"
                                          example: "Smith"
                                      required:
                                      - "given"
                                      - "family"
                                      description: "Name of the contact"
                                    telecom:
                                      type: "array"
                                      items:
                                        type: "object"
                                        properties:
                                          system:
                                            type: "string"
                                            enum:
                                            - "phone"
                                          use:
                                            type: "string"
                                            enum:
                                            - "mobile"
                                          rank:
                                            type:
                                            - "number"
                                            - "null"
                                            exclusiveMinimum: 0
                                            description: "Rank indicates what order\
                                              \ the Contact should be used in, the\
                                              \ lowest number is the highest priority.\
                                              \ Must be a positive number."
                                            example: 1
                                          value:
                                            type:
                                            - "string"
                                            - "null"
                                            description: "Value of the Contact"
                                            example: "0412345678"
                                        required:
                                        - "system"
                                        - "use"
                                        - "rank"
                                        - "value"
                                      description: "Phone number of the contact"
                              description: "A contact party (e.g. guardian, partner,\
                                \ friend) for the patient."
                          required:
                          - "system"
                          - "valueArray"
                        - type: "object"
                          properties:
                            system:
                              type: "string"
                              enum:
                              - "firstname"
                            valueString:
                              type:
                              - "string"
                              - "null"
                              description: "The first name component of the patient's\
                                \ given name."
                              example: "Joey"
                          required:
                          - "system"
                          - "valueString"
                        - type: "object"
                          properties:
                            system:
                              type: "string"
                              enum:
                              - "middlename"
                            valueString:
                              type:
                              - "string"
                              - "null"
                              description: "The middle name component of the patient's\
                                \ given name."
                              example: "Francis"
                          required:
                          - "system"
                          - "valueString"
                        - type: "object"
                          properties:
                            system:
                              type: "string"
                              enum:
                              - "pronouns"
                            valueString:
                              type:
                              - "string"
                              - "null"
                              description: "The patient's preferred pronouns."
                              example: "he/him"
                          required:
                          - "system"
                          - "valueString"
                        - type: "object"
                          properties:
                            system:
                              type: "string"
                              enum:
                              - "maiden-name"
                            valueString:
                              type:
                              - "string"
                              - "null"
                              description: "The patient's maiden name (birth family\
                                \ name)."
                              example: "Smith"
                          required:
                          - "system"
                          - "valueString"
